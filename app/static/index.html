<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d34">
<title>Finanças</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230f3d34'/%3E%3Cpath d='M9 20.5c2.2 2 4.6 3 7 3 3.6 0 6-1.8 6-4.4 0-5.6-12.6-2.6-12.6-8 0-2.5 2.4-4.3 6-4.3 2.3 0 4.4.8 6.2 2.4' fill='none' stroke='%23d9f99d' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-in" viewBox="0 0 24 24"><path d="M17 7 7 17"/><path d="M17 17H7V7"/></symbol>
    <symbol id="i-out" viewBox="0 0 24 24"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5Z"/><path d="M14 2v6h6"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.9 5.6L19.5 10.5 13.9 12.4 12 18l-1.9-5.6L4.5 10.5l5.6-1.9Z"/></symbol>
    <symbol id="i-receipt" viewBox="0 0 24 24"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8H8M16 12H8M13 16H8"/></symbol>
    <symbol id="i-barcode" viewBox="0 0 24 24"><path d="M3 5v14M8 5v14M12 5v14M17 5v14M21 5v14"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></symbol>
  </defs>
</svg>

<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true"></span>
    <div>
      <strong>Finanças</strong>
      <span id="ai-status" class="brand-sub">carregando…</span>
    </div>
  </div>
  <div class="month-switch" role="group" aria-label="Mês">
    <button class="icon-btn" id="prev" aria-label="Mês anterior"><svg><use href="#i-left"/></svg></button>
    <label class="month-label">
      <span id="month-text"></span>
      <input type="month" id="month" aria-label="Escolher mês">
    </label>
    <button class="icon-btn" id="next" aria-label="Próximo mês"><svg><use href="#i-right"/></svg></button>
  </div>
</header>

<main class="layout">
  <section class="hero">
    <div class="hero-main">
      <span class="eyebrow">Saldo do mês</span>
      <div class="hero-value" id="s-balance">R$ 0,00</div>
      <div class="flow-bar" aria-hidden="true"><span id="flow-in"></span><span id="flow-out"></span></div>
      <div class="hero-legend">
        <span><i class="dot in"></i>Entradas <b id="s-income">–</b></span>
        <span><i class="dot out"></i>Saídas <b id="s-expense">–</b></span>
      </div>
    </div>
    <div class="hero-side">
      <div class="mini">
        <span class="mini-icon"><svg><use href="#i-clock"/></svg></span>
        <div><span>A pagar no mês</span><b id="s-pending">–</b></div>
      </div>
      <div class="mini">
        <span class="mini-icon"><svg><use href="#i-in"/></svg></span>
        <div><span>A receber no mês</span><b id="s-receivable">–</b></div>
      </div>
      <div class="mini">
        <span class="mini-icon"><svg><use href="#i-alert"/></svg></span>
        <div><span>Aguardando revisão</span><b id="s-review">–</b></div>
      </div>
    </div>
  </section>

  <div id="alerts" class="alerts"></div>

  <div class="columns">
    <div class="col-main">
      <section class="card capture">
        <div class="card-head">
          <h2>Registrar</h2>
          <button class="btn ghost" id="manual-btn"><svg><use href="#i-plus"/></svg>Lançamento manual</button>
        </div>
        <label class="drop" id="drop">
          <input type="file" id="files" multiple accept=".xml,.pdf,.txt,.csv,image/*">
          <span class="drop-icon"><svg><use href="#i-upload"/></svg></span>
          <span class="drop-title">Solte arquivos aqui ou toque para escolher</span>
          <span class="drop-sub">Leitura automática com conferência dos dados</span>
          <span class="chips">
            <span class="chip"><svg><use href="#i-file"/></svg>NF-e XML</span>
            <span class="chip"><svg><use href="#i-barcode"/></svg>Boletos</span>
            <span class="chip"><svg><use href="#i-receipt"/></svg>Comprovantes</span>
            <span class="chip"><svg><use href="#i-image"/></svg>Prints e fotos</span>
            <span class="chip"><svg><use href="#i-file"/></svg>Faturas e extratos</span>
          </span>
        </label>
        <form id="text-form" class="composer">
          <textarea id="text" rows="1" placeholder="Ex.: gastei 45,90 no iFood ontem"></textarea>
          <button type="submit" class="btn primary" id="send-btn" aria-label="Registrar mensagem"><svg><use href="#i-send"/></svg><span>Registrar</span></button>
        </form>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>Movimentações</h2>
          <div class="tools">
            <div class="segmented" role="tablist">
              <button class="active" data-filter="all">Todas</button>
              <button data-filter="review">Revisar</button>
              <button data-filter="pending">Pendentes</button>
            </div>
            <label class="search"><svg><use href="#i-search"/></svg><input type="search" id="search" placeholder="Buscar"></label>
            <a id="export" class="icon-btn" href="#" title="Exportar CSV" aria-label="Exportar CSV"><svg><use href="#i-download"/></svg></a>
          </div>
        </div>
        <div id="tx-list" class="tx-list"></div>
      </section>
    </div>

    <aside class="col-side">
      <section class="card">
        <div class="card-head"><h2>Para onde foi o dinheiro</h2></div>
        <div id="categories"></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>Próximos vencimentos</h2></div>
        <div id="upcoming"></div>
      </section>
    </aside>
  </div>
</main>

<div id="toasts" class="toasts" aria-live="polite"></div>

<dialog id="editor">
  <form method="dialog" id="edit-form">
    <div class="dialog-head">
      <h3 id="edit-title">Movimentação</h3>
      <button value="cancel" class="icon-btn" formnovalidate aria-label="Fechar"><svg><use href="#i-x"/></svg></button>
    </div>
    <div class="segmented wide" id="kind-switch">
      <button type="button" data-kind="expense">Despesa</button>
      <button type="button" data-kind="income">Receita</button>
    </div>
    <input type="hidden" name="kind">
    <label class="amount-field">
      <span>R$</span>
      <input name="amount" inputmode="decimal" required placeholder="0,00" autocomplete="off" autofocus>
    </label>
    <div id="edit-notes" class="note-box" hidden></div>
    <div class="grid">
      <label class="wide">Descrição<input name="description" required maxlength="255"></label>
      <label>Categoria<select name="category" id="cat-select"></select></label>
      <label>Status<select name="status"><option value="paid">Pago / recebido</option><option value="pending">Pendente</option></select></label>
      <label>Data<input name="occurred_on" type="date" required></label>
      <label>Vencimento<input name="due_date" type="date"></label>
      <label>Contraparte<input name="counterparty" maxlength="255" placeholder="Loja, pessoa, empresa"></label>
      <label>Forma de pagamento<input name="payment_method" maxlength="40" list="methods"></label>
      <label class="wide">Conta ou cartão<input name="account" maxlength="100" placeholder="Ex.: Nubank crédito"></label>
      <label class="wide">Observações<textarea name="notes" rows="2"></textarea></label>
    </div>
    <datalist id="methods">
      <option>Pix</option><option>Cartão de crédito</option><option>Cartão de débito</option>
      <option>Dinheiro</option><option>Boleto</option><option>Transferência</option><option>Débito automático</option>
    </datalist>
    <div class="dialog-foot">
      <button type="button" id="delete-btn" class="btn danger-ghost">Excluir</button>
      <div class="spacer"></div>
      <button value="cancel" class="btn ghost" formnovalidate>Cancelar</button>
      <button value="save" class="btn primary">Salvar</button>
    </div>
  </form>
</dialog>

<script src="/static/app.js"></script>
</body>
</html>
